AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  iCamFind - camera-based visual memory. Serverless backend: HTTP API + Lambda (Graviton/arm64),
  DynamoDB event memory, S3 crop store with Glacier tiering, Claude in Amazon Bedrock agent,
  EventBridge routine checks and SNS caregiver notifications.

Parameters:
  AccessToken:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Shared secret required in the x-icamfind-token header (device and web app).
  CaregiverEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to caregiver notifications (must confirm the SNS email).
  ModelId:
    Type: String
    Default: au.anthropic.claude-haiku-4-5-20251001-v1:0
  FallbackModelId:
    Type: String
    Default: au.anthropic.claude-sonnet-4-6
  EscalationGraceSeconds:
    Type: Number
    Default: 600

Conditions:
  HasCaregiverEmail: !Not [!Equals [!Ref CaregiverEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        BUCKET_NAME: !Ref ImageBucket
        TOPIC_ARN: !Ref CaregiverTopic
        MODEL_ID: !Ref ModelId
        FALLBACK_MODEL_ID: !Ref FallbackModelId
        BEDROCK_REGION: !Ref AWS::Region
        ESCALATION_GRACE_SECONDS: !Ref EscalationGraceSeconds

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          # Long-term memory: crops are kept forever but tier down to Glacier Instant Retrieval.
          - Id: crops-to-glacier-ir
            Status: Enabled
            Prefix: crops/
            Transitions: [{ StorageClass: GLACIER_IR, TransitionInDays: 30 }]
          - Id: expire-snapshots
            Status: Enabled
            Prefix: snapshots/
            ExpirationInDays: 7
          - Id: expire-live-checks
            Status: Enabled
            Prefix: commands/
            ExpirationInDays: 30
          - Id: expire-job-images
            Status: Enabled
            Prefix: jobs/
            ExpirationInDays: 30

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ImageBucket.Arn, !Sub "${ImageBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  CaregiverTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: iCamFind
      KmsMasterKeyId: alias/aws/sns

  CaregiverSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasCaregiverEmail
    Properties:
      TopicArn: !Ref CaregiverTopic
      Protocol: email
      Endpoint: !Ref CaregiverEmail

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      CodeUri: ../build/lambda
      Description: iCamFind HTTP API and web app
      Timeout: 29
      Environment:
        Variables:
          ACCESS_TOKEN: !Ref AccessToken
          AGENT_FUNCTION: !Ref AgentFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref ImageBucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt CaregiverTopic.TopicName }
        - LambdaInvokePolicy: { FunctionName: !Ref AgentFunction }
        - Statement:
            - Sid: ClaudeOnBedrock
              Effect: Allow
              Action: ["bedrock-mantle:CreateInference", "bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"]
              Resource: "*"
            - Sid: BedrockMarketplaceFirstUse
              Effect: Allow
              Action: ["aws-marketplace:ViewSubscriptions", "aws-marketplace:Subscribe"]
              Resource: "*"
      Events:
        Root:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /, Method: ANY }
        Proxy:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/{proxy+}", Method: ANY }

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: agent.handler
      CodeUri: ../build/lambda
      Description: iCamFind perception-decision-action agent (Claude in Amazon Bedrock)
      Timeout: 240
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref ImageBucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt CaregiverTopic.TopicName }
        - Statement:
            - Sid: ClaudeOnBedrock
              Effect: Allow
              Action: ["bedrock-mantle:CreateInference", "bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"]
              Resource: "*"
            - Sid: BedrockMarketplaceFirstUse
              Effect: Allow
              Action: ["aws-marketplace:ViewSubscriptions", "aws-marketplace:Subscribe"]
              Resource: "*"

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduler.handler
      CodeUri: ../build/lambda
      Description: iCamFind routine checker
      Environment:
        Variables:
          AGENT_FUNCTION: !Ref AgentFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - LambdaInvokePolicy: { FunctionName: !Ref AgentFunction }
      Events:
        Every5Minutes:
          Type: Schedule
          Properties: { Schedule: rate(5 minutes) }

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${ApiFunction}", RetentionInDays: 30 }
  AgentLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${AgentFunction}", RetentionInDays: 30 }
  SchedulerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${SchedulerFunction}", RetentionInDays: 30 }

  AgentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: iCamFind agent errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref AgentFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Web app and API base URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref ImageBucket

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  iCamFind - camera-based visual memory. Serverless backend: HTTP API with Cognito JWT auth,
  Lambda (Graviton/arm64), DynamoDB household-partitioned memory, S3 crop store with Glacier tiering,
  Claude on Amazon Bedrock agent, EventBridge routine checks, SNS caregiver notifications, and a
  Graviton EC2 "demo home" replay camera running the OpenCV 5 edge pipeline.

Parameters:
  CaregiverEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to caregiver notifications (must confirm the SNS email).
  ModelId:
    Type: String
    Default: au.anthropic.claude-haiku-4-5-20251001-v1:0
  FallbackModelId:
    Type: String
    Default: au.anthropic.claude-sonnet-4-6
  EscalationGraceSeconds:
    Type: Number
    Default: 600
  DemoDeviceToken:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Device token for the demo replay camera (generated by scripts/deploy.py).
  DemoDeviceTokenSha256:
    Type: String
    Description: SHA-256 of DemoDeviceToken (the API stores only hashes of device tokens).
  ArtifactBucket:
    Type: String
    Description: Bucket holding the demo camera bundle (created by scripts/deploy.py).
  DemoBundleKey:
    Type: String
    Default: demo/bundle.zip
  EnableDemoCamera:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
  DemoInstanceType:
    Type: String
    Default: t4g.small
  DemoVpcId:
    Type: String
    Default: ""
    Description: VPC for the demo camera (scripts/deploy.py passes the default VPC).
  DemoAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id

Conditions:
  HasCaregiverEmail: !Not [!Equals [!Ref CaregiverEmail, ""]]
  DemoCamera: !Equals [!Ref EnableDemoCamera, "true"]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        BUCKET_NAME: !Ref ImageBucket
        TOPIC_ARN: !Ref CaregiverTopic
        MODEL_ID: !Ref ModelId
        FALLBACK_MODEL_ID: !Ref FallbackModelId
        BEDROCK_REGION: !Ref AWS::Region
        ESCALATION_GRACE_SECONDS: !Ref EscalationGraceSeconds

Resources:
  # ------------------------------------------------------------------ data
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          # Long-term memory: crops are kept forever but tier down to Glacier Instant Retrieval.
          - Id: crops-to-glacier-ir
            Status: Enabled
            Prefix: crops/
            Transitions: [{ StorageClass: GLACIER_IR, TransitionInDays: 30 }]
          - Id: expire-snapshots
            Status: Enabled
            Prefix: snapshots/
            ExpirationInDays: 7
          - Id: expire-live-checks
            Status: Enabled
            Prefix: commands/
            ExpirationInDays: 30
          - Id: expire-job-images
            Status: Enabled
            Prefix: jobs/
            ExpirationInDays: 30

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt ImageBucket.Arn, !Sub "${ImageBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  CaregiverTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: iCamFind
      KmsMasterKeyId: alias/aws/sns

  CaregiverSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasCaregiverEmail
    Properties:
      TopicArn: !Ref CaregiverTopic
      Protocol: email
      Endpoint: !Ref CaregiverEmail

  # ------------------------------------------------------------------ identity (Cognito)
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "icamfind-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: icamfind-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com/"]
      LogoutURLs: [!Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com/"]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  # ------------------------------------------------------------------ HTTP API
  WebApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: 30 }

  WebApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","time":"$context.requestTime","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","authError":"$context.authorizer.error"}'

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WebApi
      Name: cognito-jwt
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WebApi, RouteKey: "GET /", Target: !Sub "integrations/${ApiIntegration}" }
  StaticRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WebApi, RouteKey: "GET /{proxy+}", Target: !Sub "integrations/${ApiIntegration}" }
  DeviceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref WebApi, RouteKey: "ANY /api/device/{proxy+}", Target: !Sub "integrations/${ApiIntegration}" }
  UserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebApi
      RouteKey: "ANY /api/{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebApi}/*"

  # ------------------------------------------------------------------ functions
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      CodeUri: ../build/lambda
      Description: iCamFind HTTP API and web app
      Timeout: 29
      Environment:
        Variables:
          AGENT_FUNCTION: !Ref AgentFunction
          API_URL: !Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com"
          COGNITO_DOMAIN: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          DEMO_DEVICE_TOKEN_SHA256: !Ref DemoDeviceTokenSha256
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref ImageBucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt CaregiverTopic.TopicName }
        - LambdaInvokePolicy: { FunctionName: !Ref AgentFunction }
        - Statement:
            - Sid: ClaudeOnBedrock
              Effect: Allow
              Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"]
              Resource: "*"
            - Sid: BedrockMarketplaceFirstUse
              Effect: Allow
              Action: ["aws-marketplace:ViewSubscriptions", "aws-marketplace:Subscribe"]
              Resource: "*"

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: agent.handler
      CodeUri: ../build/lambda
      Description: iCamFind perception-decision-action agent (Claude on Amazon Bedrock)
      Timeout: 240
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref ImageBucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt CaregiverTopic.TopicName }
        - Statement:
            - Sid: ClaudeOnBedrock
              Effect: Allow
              Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"]
              Resource: "*"
            - Sid: BedrockMarketplaceFirstUse
              Effect: Allow
              Action: ["aws-marketplace:ViewSubscriptions", "aws-marketplace:Subscribe"]
              Resource: "*"

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scheduler.handler
      CodeUri: ../build/lambda
      Description: iCamFind routine checker
      Environment:
        Variables:
          AGENT_FUNCTION: !Ref AgentFunction
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - LambdaInvokePolicy: { FunctionName: !Ref AgentFunction }
      Events:
        Every5Minutes:
          Type: Schedule
          Properties: { Schedule: rate(5 minutes) }

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${ApiFunction}", RetentionInDays: 30 }
  AgentLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${AgentFunction}", RetentionInDays: 30 }
  SchedulerLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/aws/lambda/${SchedulerFunction}", RetentionInDays: 30 }

  AgentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: iCamFind agent errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref AgentFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ------------------------------------------------------------------ demo home replay camera (EC2 Graviton)
  DemoDeviceSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Device token of the iCamFind demo replay camera
      SecretString: !Ref DemoDeviceToken

  DemoCameraRole:
    Type: AWS::IAM::Role
    Condition: DemoCamera
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: demo-camera
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/${DemoBundleKey}"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DemoDeviceSecret

  DemoCameraProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: DemoCamera
    Properties:
      Roles: [!Ref DemoCameraRole]

  DemoCameraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: DemoCamera
    Properties:
      GroupDescription: iCamFind demo camera - no inbound access (managed through SSM)
      VpcId: !Ref DemoVpcId
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS to AWS APIs and PyPI }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Ubuntu package mirrors }

  DemoCamera:
    Type: AWS::EC2::Instance
    Condition: DemoCamera
    Properties:
      ImageId: !Ref DemoAmiId
      InstanceType: !Ref DemoInstanceType
      IamInstanceProfile: !Ref DemoCameraProfile
      SecurityGroupIds: [!GetAtt DemoCameraSecurityGroup.GroupId]
      MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 16, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: icamfind-demo-camera }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          dpkg --configure -a || true
          apt-get update -y
          apt-get install -y python3-venv python3-pip libgl1 libglib2.0-0
          id icamfind || useradd -m -s /bin/bash icamfind
          install -d -o icamfind -g icamfind /opt/icamfind
          cat > /opt/icamfind/start.sh <<'EOS'
          #!/bin/bash
          set -euo pipefail
          cd /opt/icamfind
          if [ ! -x venv/bin/python ]; then
            python3 -m venv venv
            venv/bin/pip install -q boto3 opencv-contrib-python-headless==5.0.0.93 numpy==2.4.6 requests==2.34.2
          fi
          rm -rf app && mkdir app
          venv/bin/python - <<'PY'
          import io, os, zipfile, boto3
          region = os.environ["AWS_REGION"]
          data = boto3.client("s3", region_name=region).get_object(
              Bucket=os.environ["BUNDLE_BUCKET"], Key=os.environ["BUNDLE_KEY"])["Body"].read()
          zipfile.ZipFile(io.BytesIO(data)).extractall("/opt/icamfind/app")
          token = boto3.client("secretsmanager", region_name=region).get_secret_value(
              SecretId=os.environ["SECRET_ARN"])["SecretString"]
          path = "/opt/icamfind/app/.icamfind.env"
          with open(os.open(path, os.O_WRONLY | os.O_CREAT, 0o600), "w") as f:
              f.write(f"ICAMFIND_API_URL={os.environ['API_URL']}\nICAMFIND_DEVICE_TOKEN={token}\n")
          PY
          cd app
          exec ../venv/bin/python -m icamfind run --headless --config config.demo.json
          EOS
          chmod 755 /opt/icamfind/start.sh
          cat > /etc/systemd/system/icamfind.service <<'EOS'
          [Unit]
          Description=iCamFind demo replay camera
          After=network-online.target
          Wants=network-online.target
          [Service]
          User=icamfind
          Environment=AWS_REGION=${AWS::Region}
          Environment=BUNDLE_BUCKET=${ArtifactBucket}
          Environment=BUNDLE_KEY=${DemoBundleKey}
          Environment=SECRET_ARN=${DemoDeviceSecret}
          Environment=API_URL=https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com
          ExecStart=/opt/icamfind/start.sh
          Restart=always
          RestartSec=10
          [Install]
          WantedBy=multi-user.target
          EOS
          systemctl daemon-reload
          systemctl enable --now icamfind.service

Outputs:
  ApiUrl:
    Description: Web app and API base URL
    Value: !Sub "https://${WebApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref ImageBucket
  DemoCameraInstanceId:
    Condition: DemoCamera
    Value: !Ref DemoCamera
